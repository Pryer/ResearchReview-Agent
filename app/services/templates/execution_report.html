<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究任务运行报告</title>
<style>
:root{--bg:#f5f5f0;--paper:#fff;--ink:#172f35;--muted:#5e7175;--line:#dde5e2;--green:#187264;--soft:#edf6f0;--amber:#8a5c1c;--size:17px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--size)/1.9 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,select,input{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 13px}button{cursor:pointer}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8ec9b9;outline-offset:3px}a{color:var(--green)}header,main,footer{max-width:1000px;margin:auto;padding:30px 30px 0}header{padding-top:42px}h1{font-size:32px;line-height:1.5;letter-spacing:-.03em;margin:7px 0 15px}h2{font-size:25px;line-height:1.5;margin:8px 0 16px}h3{font-size:19px;line-height:1.6;margin:25px 0 10px}p{margin:12px 0}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--green);font-weight:700}.muted,small{color:var(--muted)}.intro{font-size:18px;max-width:880px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:23px 0}.metric{padding:14px 17px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.metric b{font-size:27px;display:block;line-height:1.5}.metric span{font-size:13px;color:var(--muted)}.toolbar,.tabs,.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin:16px 0 8px}.tabs{margin:24px 0 10px}.tabs button[aria-selected=true]{background:var(--ink);color:white;border-color:var(--ink)}.filters{margin:10px 0 20px}.filters input{flex:1;min-width:160px}.filters select{max-width:100%}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:25px 29px;margin:0 0 18px;overflow-wrap:anywhere}.round{position:relative;border-top:3px solid #b9d8cc}.round .tag{font-size:12px;display:inline-block;padding:2px 9px;background:var(--soft);color:var(--green);border-radius:5px;margin-right:7px}.round h2{font-size:22px;margin:10px 0}.reason{font-size:18px;line-height:1.95}.call{border-left:3px solid #9fcab9;background:#f6faf7;padding:13px 18px;border-radius:0 8px 8px 0;margin:17px 0}.call h3{margin:0 0 7px;font-size:17px}.outcome{display:inline-block;font-size:12px;color:var(--muted);margin-left:7px}.delta{display:flex;gap:8px;flex-wrap:wrap}.delta span{padding:4px 10px;font-size:14px;border-radius:7px;background:var(--soft)}.note{padding:12px 16px;background:#f1f5f3;border-radius:8px;color:var(--muted);font-size:15px}.warn{background:#fff7e9;color:#79511c}.empty{padding:25px;text-align:center;color:var(--muted)}details{border:1px solid var(--line);border-radius:9px;margin:12px 0;overflow:hidden}summary{padding:12px 16px;cursor:pointer;font-size:15px;font-weight:600}details .inside{padding:0 16px 16px}.raw{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font:13px/1.75 ui-monospace,Consolas,monospace;background:#f4f6f7;border-radius:7px;padding:15px;max-height:65vh;overflow:auto;color:#2c444c}.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px}.kv dt{color:var(--muted);font-size:14px}.kv dd{margin:0;overflow-wrap:anywhere}.list{padding-left:23px}.list li{padding:3px 0}.smallbtn{padding:4px 10px;font-size:13px}.table{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}.path{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}.change{padding:14px 0;border-bottom:1px solid var(--line)}.change p{margin:4px 0;font-size:15px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair>div{min-width:0;padding:10px;background:#f6f8f7;border-radius:8px}.pair small{display:block}.pill{font-size:13px;border-radius:20px;padding:4px 12px;background:var(--soft);color:var(--green)}footer{padding-bottom:45px;font-size:13px;color:var(--muted)}.jumper{width:100%}.back{font-size:14px;padding:5px 10px}.sectionnav{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.noscript{padding:20px}.technical{font-size:13px}code{font:13px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:650px){header,main,footer{padding-left:16px;padding-right:16px}header{padding-top:26px}h1{font-size:27px}.intro,.reason{font-size:17px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px 14px}.metric b{font-size:24px}.card{padding:20px 17px}.round h2{font-size:21px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tabs button{font-size:14px;padding:8px}.kv{grid-template-columns:100px minmax(0,1fr);gap:7px 12px}.pair{grid-template-columns:1fr}.filters{align-items:stretch}.filters input{width:100%}.filters select{flex:1}.toolbar{font-size:14px}.call{padding:12px 13px}td,th{padding:8px}.jumper{font-size:14px}pre{font-size:12px}.sectionnav{position:static}}@media print{.toolbar,.tabs,.filters,.sectionnav,.back{display:none}header,main{max-width:none;padding:0}body{background:#fff}.card{break-inside:avoid}pre{max-height:none}}
</style></head><body>
<header><div class="eyebrow">RESEARCHREVIEW-AGENT · 运行回顾</div><h1>这次研究任务是怎样完成的</h1><p class="intro" id="request"></p><div id="metrics" class="metrics"></div><div class="toolbar"><span id="status" class="pill"></span><span><button id="smaller" class="smallbtn" aria-label="缩小字号">A−</button> <button id="larger" class="smallbtn" aria-label="放大字号">A＋</button> <button id="download" class="smallbtn">下载结构化记录</button></span></div><nav class="tabs" aria-label="报告章节"><button data-view="story">① 按时间顺着读</button><button data-view="main">② Main 看到了什么</button><button data-view="sub">③ 子Agent 如何执行</button><button data-view="result">④ 结果与检查</button></nav><div class="filters"><label class="sr" for="search">搜索本轮目的或执行动作</label><input id="search" placeholder="搜索目的、动作或问题"><label class="sr" for="role">筛选角色</label><select id="role"><option value="all">全部角色</option><option value="search">Search · 检索</option><option value="analysis">Analysis · 分析</option><option value="writing">Writing · 写作</option><option value="check">Check · 核验</option></select></div></header>
<main id="content"></main><footer id="footer"></footer><noscript><p class="noscript">此报告需要JavaScript显示交互时间线；结构化数据可从报告目录读取。</p></noscript>
<script id="report-data" type="application/json">REPORT_DATA_PLACEHOLDER</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),$=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACTION={search_and_rank:'发现并筛选论文',fetch_metadata:'获取详情与核对书目',extract_paper_cards:'读取原文并建立证据卡',plan_claims:'规划可用于写作的主张',publish_draft:'发布当前草稿',generate_deliverables:'生成候选稿',validate_result:'独立检查候选稿',diagnose_evidence_gaps:'找出证据缺口',targeted_search:'针对缺口补检索',validate_routes:'检查研究路线',rewrite_sections:'修订存在问题的段落',request_finish:'结束本次任务'};
const ROLE={search:'Search · 检索',analysis:'Analysis · 分析',writing:'Writing · 写作',check:'Check · 核验'},STATUS={completed:'完成',partial:'已交付草稿',blocked:'因条件不足停止',failed:'执行失败',cancelled:'已取消',needs_clarification:'等待补充信息',waiting_user:'等待补充信息',unknown:'状态未记录'};
const FIELD={goal:'任务目标',state:'当前状态',key_evidence:'关键证据',decisions:'已有决策',open_questions:'未解决问题',allowed_actions:'当前可选动作',budget_remaining:'剩余预算',gate_status:'门禁与检查',last_task_result:'上一次执行结果',candidate_papers:'候选论文',ranked_papers:'筛选后的论文',paper_details:'论文详情',paper_cards:'证据卡',claim_plans:'写作主张',review:'候选正文',parsed_papers:'解析后的原文',work_context:'本角色工作记忆',check_report:'检查报告',effective_config:'生效配置',context_packet:'分发的补充上下文',start_year:'起始年份',end_year:'截止年份',required_reference_count:'最终引用目标',searched_keywords:'已经搜索的词',source_diagnostics:'来源执行情况',input_delta:'输入依赖变化',prior_result:'同角色上一次结果'};
let view='story',chosen=0,rawValues=[],font=17;
function label(action){return ACTION[action]||action||'未记录'}
function concise(x,n=230){let s=typeof x==='string'?x:JSON.stringify(x);return s==null?'未提供':s.length>n?s.slice(0,n)+'…':s}
function raw(title,value){let i=rawValues.push(value)-1;return `<details class="raw" data-raw="${i}"><summary>${esc(title)}</summary><div class="inside"><pre>展开后加载</pre></div></details>`}
function changedStats(a,b){return Object.keys(b).filter(k=>!['LLM请求','检索模型请求','Main轮次'].includes(k)&&a[k]!==b[k]).map(k=>`<span>${esc(k)}：${esc(a[k]??'—')} → <b>${esc(b[k])}</b></span>`).join('')||'<span>资料或发布状态没有新增变化</span>'}
function numbers(a,b){return `<div class="table"><table><tr><th>观察项</th><th>执行前</th><th>执行后</th></tr>${Object.keys({...a,...b}).map(k=>`<tr><td>${esc(k)}</td><td>${esc(a[k]??'—')}</td><td>${esc(b[k]??'—')}</td></tr>`).join('')}</table></div>`}
function matching(x){const q=$('#search').value.trim().toLowerCase();return !q||[x.objective,x.decision?.reason,x.operation,x.action,label(x.operation||x.action),...(x.result?.findings||[])].join(' ').toLowerCase().includes(q)}
function findingList(values){return values?.length?`<ul class="list">${values.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">没有独立记录的结果摘要。</p>'}
function roleSummary(c){const result=c.returned_to_main||c.result||{};return `<div class="call"><h3>${esc(ROLE[c.role]||c.role)}<span class="outcome">${result.outcome==='degraded'?'已执行，仍有缺口':result.status==='failed'?'尚未完成':result.status==='completed'?'已执行并返回结果':'执行状态待核对'}</span></h3>${findingList(c.result?.findings?.length?c.result.findings:result.findings)}<button class="smallbtn" data-call="${c.call-1}">查看它收到的上下文和返回结果 →</button></div>`}
function story(){const list=D.rounds.filter(matching);return `<section class="card"><h2>先读目的，再看结果</h2><p>每一轮先说明Main为什么选择这个动作，再展示专业Agent做了什么，以及资料、正文和检查状态发生了哪些变化。点击卡片末尾可以继续看上下文。</p><p class="note">本次共 ${D.summary.main_rounds} 轮Main动作，其中 ${D.summary.main_model_calls} 轮调用决策模型、${D.summary.policy_rounds} 轮由已有策略交接；专业Agent共接受 ${D.summary.delegations} 次委派。</p></section>${list.length?list.map(r=>`<article class="card round"><span class="tag">第 ${r.round} 轮</span><small>${esc(r.origin)}</small><h2>${esc(label(r.action))}</h2><p class="reason">${esc(r.decision.reason||'按当前任务与状态推进。')}</p><div class="delta">${changedStats(r.before||{},r.after||{})}</div>${D.calls.filter(c=>c.main_round===r.round).map(roleSummary).join('')}<p><button class="back" data-main="${r.round-1}">看Main本轮的上下文 →</button></p><details><summary>展开状态数字</summary><div class="inside">${numbers(r.before||{},r.after||{})}</div></details></article>`).join(''):`<section class="card empty">${D.rounds.length?'没有匹配的轮次。':'本报告没有可恢复的Main轮次记录。'}${D.meta?.error_type?'<p>停止原因类型：'+esc(D.meta.error_type)+'</p>':''}</section>`}`}
function picker(kind){const items=kind==='main'?D.rounds:D.calls.filter(c=>($('#role').value==='all'||c.role===$('#role').value)&&matching(c));return `<select class="jumper" id="picker" aria-label="选择轮次或专业委派">${items.map((x,i)=>`<option value="${kind==='main'?i:x.call-1}" ${(kind==='main'?i:x.call-1)===chosen?'selected':''}>${kind==='main'?'第 '+x.round+' 轮':'第 '+x.call+' 次 · '+(ROLE[x.role]||x.role)}｜${esc(label(x.action||x.operation))}</option>`).join('')}</select><div class="sectionnav"><button class="smallbtn" id="prev">← 上一个</button><button class="smallbtn" id="next">下一个 →</button></div>`}
function diff(rows){return rows.length?rows.map(x=>`<div class="change"><b>${esc(FIELD[x.path.split('.')[0]]||x.path.split('.').at(-1))}</b><span class="path"> · ${esc(x.path)}</span><div class="pair"><div><small>此前</small>${esc(concise(x.before))}</div><div><small>本次</small>${esc(concise(x.after))}</div></div></div>`).join(''):'<p class="muted">没有可比较的新增上下文变化。</p>'}
function evidence(items,kind){return items?.length?items.map(x=>`<div class="call"><b>${esc(x.title||x.question||x.action&&label(x.action)||x.evidence_id||kind)}</b><p>${esc(x.summary||x.finding||x.reason||x.description||x.text||x.question||concise(x))}</p></div>`).join(''):'<p class="muted">本轮没有此类条目。</p>'}
function mainView(){if(!D.rounds.length)return '<section class="card empty">本次尚未进入Main决策循环。</section>';chosen=Math.min(chosen,D.rounds.length-1);let r=D.rounds[chosen],c=r.context;return `<section class="card">${picker('main')}<h2>第 ${r.round} 轮：${esc(label(r.action))}</h2><p class="reason">${esc(r.decision.reason)}</p><p class="note">${r.model_input?'本轮由模型选择动作。':'本轮由已有策略完成交接，没有新增Main模型请求。'}${c?'下方展示本轮保存的任务与上下文。':'历史任务未单独保存此轮快照，仍保留动作前后状态。'}</p><h3>此时的资料与执行状态</h3><div class="delta">${changedStats(r.before||{},r.after||{})}</div>${c?`<h3>任务目标</h3><p>${esc(D.request)}</p>${raw('展开本轮目标与约束原值',c.goal)}<h3>这轮上下文变了什么</h3><p class="muted">与${r.previous_input_round?'第 '+r.previous_input_round+' 轮':'初始状态'}比较。数组整体比较，大字段显示预览。</p>${diff(r.context_changes||[])}<h3>本轮呈现的关键证据</h3>${evidence(c.key_evidence,'证据')}<h3>已有决策</h3>${evidence(c.decisions,'决策')}<h3>仍未解决的问题</h3>${evidence(c.open_questions,'问题')}<details><summary>技术细节：五字段原值与消息轨迹</summary><div class="inside">${Object.entries(c).map(([k,v])=>raw(FIELD[k]||k,v)).join('')}${raw('本次决策前的历史消息（不含system）',r.messages_without_system)}${raw('归档或捕获出处',r.context_source)}</div></details>`:''}<h3>Main规划了什么</h3>${findingList((r.decision.plan||[]).map(x=>label(x.action)+'：'+x.objective))}${raw('本轮动作、参数和上下文选择原值',r.decision)}<p><button class="back" data-view="story">← 返回整条时间线</button></p></section>`}
function subView(){let role=$('#role').value,list=D.calls.filter(c=>(role==='all'||c.role===role)&&matching(c));if(!list.length)return '<section class="card empty">没有匹配的专业委派。</section>';if(!list.some(c=>c.call-1===chosen))chosen=list[0].call-1;let c=D.calls[chosen],w=c.work_context||{},delta=w.input_delta||{},result=c.returned_to_main||c.result||{};return `<section class="card">${picker('sub')}<span class="pill">${esc(ROLE[c.role]||c.role)}</span><h2>第 ${c.call} 次委派：${esc(label(c.operation))}</h2><p class="reason">${esc(c.objective)}</p><p><button class="back" data-main="${Math.max(0,c.main_round-1)}">来自Main第 ${c.main_round} 轮 →</button> ${c.previous_same_role_call?`<button class="back" data-call="${c.previous_same_role_call-1}">与本角色上次调用比较 →</button>`:''}</p><h3>它收到什么</h3><p>Main${c.context_packet?'显式选择了一组补充上下文':'未额外指定选取ID，本次按操作契约提供输入'}。同角色以前的结果放在工作记忆中，当前证据与权限仍按本次材料判断。</p><dl class="kv"><dt>继承的上次任务</dt><dd>${esc(label(w.prior_result?.operation)||'本报告中首次调用')}</dd><dt>依赖变化</dt><dd>${esc((delta.changed_fields||[]).map(x=>FIELD[x]||x).join('、')||'没有已存在依赖发生变化')}</dd><dt>新增输入依赖</dt><dd>${esc((delta.new_fields||[]).map(x=>FIELD[x]||x).join('、')||'无')}</dd><dt>移除输入依赖</dt><dd>${esc((delta.removed_fields||[]).map(x=>FIELD[x]||x).join('、')||'无')}</dd></dl>${raw('展开Main分发的补充上下文',c.context_packet)}${raw('展开完整角色工作记忆',w)}<h3>它执行后返回了什么</h3>${findingList(c.result?.findings?.length?c.result.findings:result.findings)}<p class="note">执行状态：${esc(result.status||'未完成')}；业务结果：${esc(result.outcome||'未记录')}。执行完成与证据充分分别判断。</p>${result.issues?.length?`<h3>返回的问题与原因</h3>${findingList(result.issues.map(x=>x.reason||x.message||x.code))}`:''}${result.suggested_actions?.length?`<h3>给Main的下一步建议</h3>${findingList(result.suggested_actions.map(x=>label(x.action)+(x.reason?'：'+x.reason:'')))}`:''}<h3>执行前后的变化</h3><div class="delta">${changedStats(c.before||{},c.after||{})}</div><h3>为下一次调用留下了什么</h3>${findingList(c.work_summary_after?.last_result?.findings)}<details><summary>技术细节：输入、工具步骤和返回数据</summary><div class="inside">${raw('按契约提供的业务输入（大字段为带哈希预览）',c.input_state)}${raw('原始资料引用',c.input_artifacts||c.controlled_file_references)}${raw('与同角色上次输入的字段差异',c.same_role_input_changes)}${raw('工具步骤、输入输出及时间',c.steps)}${raw('实际返回Main的结构化结果',result)}${raw('完成后保存的角色摘要',c.work_summary_after)}${raw('本次通信与控制轨迹',c.messages||c.control_trajectory)}</div></details></section>`}
function results(){let s=D.summary;return `<section class="card"><h2>本次交付与执行结果</h2><p class="reason">${esc(STATUS[D.status]||D.status)}；发布版本 ${s.publication_version||0}，结果中记录 ${s.references||0} 篇参考文献。</p><div class="table"><table><tr><th>观察项</th><th>记录值</th></tr><tr><td>本次模型请求</td><td>${s.total_requests}</td></tr><tr><td>累计已用 / 总预算</td><td>${s.cumulative_requests??'—'} / ${s.request_limit||'未设置'}</td></tr><tr><td>Main模型决策 / 策略交接</td><td>${s.main_model_calls} / ${s.policy_rounds}</td></tr><tr><td>专业Agent委派</td><td>${s.delegations}</td></tr><tr><td>本次总耗时</td><td>${s.seconds} 秒</td></tr><tr><td>首稿时间（任务累计口径）</td><td>${s.first_draft_seconds??'未发布'} 秒</td></tr></table></div>${D.meta?.error_type?`<p class="note warn">停止原因类型：${esc(D.meta.error_type)}。报告保留已有轨迹，未把中断标记成成功。</p>`:''}${D.clarification?raw('待补充的信息',D.clarification):''}<h3>上下文是怎么保存和更新的</h3><p>同一轮运行的历史消息与观察按Epoch归档。专业Agent的新委派使用新的当前消息窗口，同时继承同角色的工作摘要和依赖变化。旧建议不等于新的证据授权。</p>${raw('查看上下文Epoch更新',D.epochs)}<h3>报告的读取范围</h3>${findingList(D.limitations)}<p class="muted technical">报告ID：${esc(D.run_id)}<br>生成时间：${esc(D.meta?.created_at||'历史数据导出')}<br>源检查点范围：${esc(D.meta?.start_version??'—')} → ${esc(D.meta?.end_version??'—')}</p></section>`}
function runtimeView(){const groups=D.delegation_runs||[],tools=D.tool_calls||[];if(!groups.length&&!tools.length)return '';const profiles={initial_research:'初始检索',gap_recovery:'补充证据',evidence_build:'构建证据与主张',gap_diagnosis:'诊断证据缺口',scope_revision:'修订研究结构',draft_generation:'生成候选稿',section_revision:'修订章节',independent_check:'独立核验',single_action:'指定研究动作',legacy_single_v1:'兼容恢复'};const outcomes={satisfied:'阶段完成',partial:'部分完成',needs_help:'需主控协调',blocked:'阻断'};const names={paper_search:'论文检索',metadata_read:'元数据核验',pdf_download:'PDF下载',pdf_parse:'PDF解析',llm_completion:'模型生成',embedding_request:'向量编码',rerank_request:'相关性重排',vector_read:'向量快照读取',vector_write:'向量快照构建',artifact_read:'资料读取',artifact_write:'资料存储',candidate_read:'候选回读',candidate_write:'候选审计'};const states={completed:'调用完成',failed:'调用失败',pending:'待确认',uncertain:'执行结果未知'};return `<section class="card"><h2>任务委派与工具回执</h2><p>本轮有 ${groups.length} 次任务级委派、${D.summary.action_attempts||0} 次研究动作尝试和 ${tools.length} 次工具调用。工具执行状态与证据、引用验收分别判断。</p><div class="table"><table><tr><th>任务阶段</th><th>研究动作</th><th>阶段结果</th></tr>${groups.map(g=>`<tr><td>${esc(profiles[g.profile]||'专业任务')}</td><td>${g.actions.length}</td><td>${esc(outcomes[g.result?.outcome]||'尚未返回')}</td></tr>`).join('')}</table></div><details><summary>查看最近工具回执</summary><div class="inside table"><table><tr><th>工具类别</th><th>调用状态</th><th>耗时</th></tr>${tools.slice(-100).map(t=>`<tr><td>${esc(names[t.tool]||'受控工具')}</td><td>${esc(states[t.status]||t.status)}</td><td>${t.duration_ms??'—'} ms</td></tr>`).join('')}</table></div></details></section>`}
function render(){rawValues=[];$('#search').disabled=view==='main'||view==='result';$('#role').disabled=view!=='sub';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));$('#content').innerHTML=view==='story'?story():view==='main'?mainView():view==='sub'?subView():results()+runtimeView();document.querySelectorAll('details[data-raw]').forEach(node=>node.addEventListener('toggle',()=>{if(node.open&&!node.dataset.loaded){node.querySelector('pre').textContent=JSON.stringify(rawValues[Number(node.dataset.raw)],null,2);node.dataset.loaded='true'}}));if($('#picker'))$('#picker').onchange=e=>{chosen=Number(e.target.value);render()};if($('#prev')){const ids=(view==='main'?D.rounds.map((x,i)=>i):D.calls.filter(c=>($('#role').value==='all'||c.role===$('#role').value)&&matching(c)).map(c=>c.call-1));$('#prev').onclick=()=>{chosen=ids[Math.max(0,ids.indexOf(chosen)-1)];render()};$('#next').onclick=()=>{chosen=ids[Math.min(ids.length-1,ids.indexOf(chosen)+1)];render()}}}
function go(next,index=0){view=next;chosen=index;$('#search').value='';$('#role').value='all';render();$('#content').scrollIntoView({behavior:'smooth',block:'start'})}
$('#request').textContent=D.request||'本次没有记录到研究请求。';$('#status').textContent=STATUS[D.status]||D.status||'运行报告';$('#metrics').innerHTML=[[D.summary.main_rounds,'轮Main动作'],[D.summary.delegations,'次专业委派'],[D.summary.total_requests,'次本次模型请求'],[D.summary.seconds+'s','本次耗时']].map(([n,l])=>`<div class="metric"><b>${esc(n)}</b><span>${l}</span></div>`).join('');$('#footer').textContent='本报告由实际执行记录生成。正文、执行状态与诊断报告分别保存；页面离线可读，不发起网络请求。';
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view)go(b.dataset.view);if(b.dataset.main!==undefined)go('main',Number(b.dataset.main));if(b.dataset.call!==undefined)go('sub',Number(b.dataset.call))});$('#search').addEventListener('input',render);$('#role').addEventListener('change',render);$('#smaller').onclick=()=>{font=Math.max(14,font-1);document.documentElement.style.setProperty('--size',font+'px')};$('#larger').onclick=()=>{font=Math.min(23,font+1);document.documentElement.style.setProperty('--size',font+'px')};$('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='运行记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
